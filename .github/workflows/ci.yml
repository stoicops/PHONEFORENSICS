name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests/python
      - run: python -m ruff format --check src tests/python
      - run: python -m mypy
      - run: python -m pytest --cov --cov-fail-under=85
      - run: python -m build
      - run: python -m pip_audit -r requirements.lock --progress-spinner off
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'

  web:
    name: Front end and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
